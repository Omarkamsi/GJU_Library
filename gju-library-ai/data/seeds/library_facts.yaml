# Canonical library facts. Each entry generates one Passage per language.
# These are sourced from the M0 spec and official library documents.

- key: opac
  subjects: [catalog]
  en:
    title: Library catalog (OPAC)
    body: |
      For a specific book's availability, location, or call number, search the
      GJU Library Catalog (OPAC) at http://hip.jopuls.org.jo/web/gju .
      The catalog also exposes the digital repository for theses and student
      projects.
  ar:
    title: فهرس المكتبة (OPAC)
    body: |
      للبحث عن توفر كتاب معيّن أو رقم تصنيفه أو موقعه، استخدم فهرس مكتبة
      الجامعة الألمانية الأردنية (OPAC) على الرابط:
      http://hip.jopuls.org.jo/web/gju .
      يوفّر الفهرس أيضاً المستودع الرقمي للأطروحات ومشاريع الطلبة.
  de:
    title: Bibliothekskatalog (OPAC)
    body: |
      Für die Verfügbarkeit, Signatur oder den Standort eines bestimmten
      Buches nutze den OPAC der GJU-Bibliothek:
      http://hip.jopuls.org.jo/web/gju .
      Über den Katalog sind auch das digitale Repositorium für Abschluss-
      und Studienarbeiten zugänglich.

- key: library-hours
  subjects: [hours, schedule, opening-times]
  en:
    title: Library opening hours
    body: |
      GJU Library is open Sunday to Thursday, 8:00 AM – 5:00 PM.
      The library is closed on Fridays, Saturdays, and official public holidays.
      Exception: during examination periods the library also opens on Saturdays.
      Main campus branch (Mushaqar, West Madaba Street): Sunday–Thursday 8 AM–4 PM.
      Architecture branch (Jabal Amman, Daret Othman Bdair): Sunday–Thursday 8 AM–4 PM.
  ar:
    title: ساعات دوام المكتبة
    body: |
      تعمل مكتبة الجامعة الألمانية الأردنية من الأحد إلى الخميس، من الساعة 8 صباحاً حتى 5 مساءً.
      تُغلق المكتبة يومَي الجمعة والسبت وفي أيام العطل الرسمية.
      استثناء: خلال فترة الامتحانات تفتح المكتبة أيضاً يوم السبت.
      الفرع الرئيسي (المشقر، شارع مادبا الغربي): الأحد–الخميس من 8 صباحاً–4 عصراً.
      فرع كلية العمارة (جبل عمان، دارة عثمان بدير): الأحد–الخميس من 8 صباحاً–4 عصراً.
  de:
    title: Öffnungszeiten der Bibliothek
    body: |
      Die GJU-Bibliothek ist von Sonntag bis Donnerstag von 8:00 bis 17:00 Uhr geöffnet.
      Freitag, Samstag und offizielle Feiertage sind Schließtage.
      Ausnahme: Während der Prüfungszeit öffnet die Bibliothek auch samstags.
      Hauptcampus (Mushaqar, West Madaba Street): So–Do 8–16 Uhr.
      Architekturfakultät-Zweigstelle (Jabal Amman, Daret Othman Bdair): So–Do 8–16 Uhr.

- key: library-locations
  subjects: [location, address, campus, branch]
  en:
    title: Library locations and addresses
    body: |
      GJU Library has two locations:
      1. Main Library — inside the GJU main campus, Mushaqar, West Madaba Street, Amman, Jordan.
         This is the primary library with the main collection, computer lab, study rooms,
         exhibition hall, and auditorium.
      2. Architecture Branch — Faculty of Architecture and Built Environment,
         Jabal Amman, Daret Othman Bdair, Amman, Jordan.
      Official library page: https://www.gju.edu.jo/content/library-439
      University website: https://www.gju.edu.jo
  ar:
    title: مواقع المكتبة وعناوينها
    body: |
      تمتلك مكتبة الجامعة الألمانية الأردنية موقعين:
      1. المكتبة الرئيسية — داخل الحرم الجامعي الرئيسي، المشقر، شارع مادبا الغربي، عمّان.
         تضم المجموعة الرئيسية، ومختبر الحاسوب، وغرف الدراسة، وقاعة المعارض، والمدرج.
      2. فرع كلية العمارة — كلية العمارة والبيئة المبنية، جبل عمان، دارة عثمان بدير، عمّان.
      صفحة المكتبة الرسمية: https://www.gju.edu.jo/content/library-439
  de:
    title: Standorte und Adressen der Bibliothek
    body: |
      Die GJU-Bibliothek hat zwei Standorte:
      1. Hauptbibliothek — im Hauptcampus der GJU, Mushaqar, West Madaba Street, Amman.
         Hauptbestand, Computerraum, Lernräume, Ausstellungshalle und Auditorium.
      2. Zweigstelle Architektur — Fakultät für Architektur und Bauumwelt,
         Jabal Amman, Daret Othman Bdair, Amman.
      Offizielle Bibliotheksseite: https://www.gju.edu.jo/content/library-439

